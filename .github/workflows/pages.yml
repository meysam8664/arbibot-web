name: Deploy dashboard to GitHub Pages

# Publishes the dashboard as a real, public HTTPS URL that you can open on your
# phone — no server of your own required. The built app runs the scanner inside
# the browser (it detects that no same-origin /api exists and switches to the
# on-device engine).
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Then run this workflow (or push to main).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (sub-path base for project pages)
        env:
          # https://<user>.github.io/<repo>/ needs the repo name as base path.
          ARBIBOT_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add SPA-friendly 404
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
