<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ArbiBot Web — offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(900px 500px at 20% -10%, rgba(91, 140, 255, 0.16), transparent 60%), #080b12;
        color: #e9edf8;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        padding: 24px;
      }
      main {
        max-width: 420px;
        text-align: center;
        border: 1px solid #1f2947;
        border-radius: 16px;
        padding: 28px 24px;
        background: #0d1220;
      }
      h1 { font-size: 18px; margin: 0 0 10px; }
      p { color: #9aa6c4; font-size: 14px; line-height: 1.6; margin: 0 0 16px; }
      button {
        padding: 10px 18px;
        border-radius: 10px;
        border: 1px solid rgba(91, 140, 255, 0.5);
        background: rgba(91, 140, 255, 0.14);
        color: #e9edf8;
        font-size: 14px;
      }
      .mark { font-size: 26px; color: #5b8cff; margin-bottom: 10px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">⬡</div>
      <h1>You are offline</h1>
      <p>
        ArbiBot Web needs a live connection to compare exchange prices. Reconnect to Wi-Fi or mobile data and try
        again — the last view you opened is still cached.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
